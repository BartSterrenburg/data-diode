<text x="1235" y="300" font-size="18" font-weight="bold">LED D3</text><text x="1235" y="327" font-size="14">R14 actief-laag</text>
<g stroke="#24445c" stroke-width="2" marker-end="url(#a)"><path d="M185 295H250" marker-start="url(#a)"/><path d="M455 295H525" marker-start="url(#a)"/><path d="M760 285H885"/><path d="M885 340H760"/><path d="M1110 315H1180"/></g>
<text x="215" y="228" font-size="13">Ethernet</text><text x="490" y="228" font-size="13">MIO</text><text x="822" y="260" font-size="14">AXI-registers</text><text x="822" y="365" font-size="14">Status terug</text>
<text x="675" y="520" font-size="17">LED 1 / LED 0 → FPGA verwerkt → ARM leest status + teller → OK via dezelfde TCP-verbinding</text>
<text x="675" y="553" font-size="15">Bestaand: lwIP, AMD PS/AXI/reset-IP en drivers. Projectspecifiek: VHDL-registers, protocol, server en client.</text>
<text x="675" y="582" font-size="15">Deze tussenstap is nog geen data-diode: PL ETH / beveiligde laptop zijn nog niet onderdeel van deze demo.</text>
