<rect width="1350" height="620" fill="white"/>
<g font-family="Arial,sans-serif" fill="#152f44" text-anchor="middle">
<text x="675" y="42" font-size="27" font-weight="bold">TCP → ARM → FPGA → LED D3</text>
<text x="675" y="72" font-size="16">LED-demonstratie • terugmelding na verwerking door de FPGA • tijdelijk geladen via JTAG</text>
<rect x="220" y="110" width="1100" height="370" rx="20" fill="#f8fafc" stroke="#24445c" stroke-width="2"/>
<text x="770" y="140" font-size="22" font-weight="bold">MicroPhase Z7-Nano</text>
<rect x="500" y="165" width="635" height="285" rx="12" fill="white" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="815" y="192" font-size="18" font-weight="bold">Zynq XC7Z020-chip</text>
<rect x="25" y="245" width="160" height="125" rx="9" fill="#e2e8f0" stroke="#24445c"/>
<text x="105" y="277" font-size="19" font-weight="bold">Laptop</text><text x="105" y="308" font-size="16">Pythonclient</text><text x="105" y="335" font-size="15">192.168.2.1</text>
<rect x="250" y="245" width="205" height="125" rx="9" fill="#fff1df" stroke="#9a641e"/>
<text x="352" y="276" font-size="19" font-weight="bold">PS ETH</text><text x="352" y="306" font-size="16">RJ45 + RTL8211F PHY</text><text x="352" y="335" font-size="15">Op board, buiten chip</text>
<rect x="525" y="220" width="235" height="190" rx="9" fill="#e0f2fe" stroke="#0284c7"/>
<text x="642" y="249" font-size="19" font-weight="bold">PS: ARM + Ethernet MAC</text><text x="642" y="280" font-size="16">Bare-metal C + lwIP</text><text x="642" y="308" font-size="16">TCP-server :5001</text><text x="642" y="336" font-size="16">Parser + FPGA-driver</text><text x="642" y="383" font-size="15">192.168.2.2</text>
<rect x="885" y="220" width="225" height="190" rx="9" fill="#dcfce7" stroke="#16a34a"/>
<text x="997" y="249" font-size="19" font-weight="bold">PL: FPGA-logica</text><text x="997" y="280" font-size="16">Eigen VHDL-registers</text><text x="997" y="308" font-size="16">Commando → LED-status</text><text x="997" y="336" font-size="16">Verwerkingsteller</text><text x="997" y="383" font-size="15">100 MHz + reset uit PS</text>
